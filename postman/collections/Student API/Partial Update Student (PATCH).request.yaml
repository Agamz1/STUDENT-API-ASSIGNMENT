$kind: http-request
name: 'Partial Update Student (PATCH)'
method: PATCH
url: '{{baseUrl}}/students/{{studentId}}'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "age": 24
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("age equals 24", function () {
        var json = pm.response.json();
        pm.expect(json.age).to.eql(24);
      });

      pm.test("name is still 'Alice Smith' (unchanged)", function () {
        var json = pm.response.json();
        pm.expect(json.name).to.eql("Alice Smith");
      });
