$kind: http-request
name: Delete Student
method: DELETE
url: '{{baseUrl}}/students/{{studentId}}'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204", function () {
        pm.response.to.have.status(204);
      });

      pm.test("Response body is empty", function () {
        pm.expect(pm.response.text()).to.eql("");
      });
